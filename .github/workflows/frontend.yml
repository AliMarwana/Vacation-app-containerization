name: Frontend CI/CD

on:
  push:
    branches:
      - main 
      - develop 
    
  pull_request:
    branches:
      - main 
      - develop 
env:
  DOCKER_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/backend-vacation:${{ github.sha }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  lint-and-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          cd frontend
          npm install  # Installs everything in package.json
            # Explicitly install ESLint

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-vacation:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
                  # Install Docker if not present
                  if ! command -v docker &> /dev/null; then
                    echo "Installing Docker..."
                    curl -fsSL https://get.docker.com -o get-docker.sh
                    sudo sh get-docker.sh
                    sudo usermod -aG docker $USER
                    sudo systemctl start docker
                  fi
                  
                  # Install Docker Compose if not present
                  if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
                    echo "Installing Docker Compose..."
                    sudo apt-get update
                    sudo apt-get install docker-compose -y
                  fi
                  # Pull latest images
                  echo "📦 Pulling latest images..."
                  docker compose pull
                  
                  # Stop and remove old containers
                  echo "🔄 Restarting containers..."
                  docker compose down
                  
                  # Start new containers
                  docker compose up -d --remove-orphans
                  
                  # Clean up old images
                  echo "🧹 Cleaning up..."
                  docker system prune -f
                  
                  # Check if containers are running
                  echo "✅ Checking container status..."
                  docker compose ps
